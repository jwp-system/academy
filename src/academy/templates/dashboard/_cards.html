<div class="stats">
  <a class="stat" href="/attendance">
    <div class="label">오늘 수업</div>
    <div class="value">{{ stats.today_sessions }}<small>개</small></div>
  </a>
  <a class="stat {{ 'is-alert' if stats.absent_today }}" href="/attendance">
    <div class="label">오늘 결석</div>
    <div class="value">{{ stats.absent_today }}<small>명</small></div>
  </a>
  {% if 'unpaid' in stats %}
  <a class="stat {{ 'is-alert' if stats.unpaid }}" href="/billing">
    <div class="label">이번 달 미납</div>
    <div class="value">{{ stats.unpaid }}<small>건</small></div>
  </a>
  <a class="stat {{ 'is-alert' if stats.match_review }}" href="/billing">
    <div class="label">입금 확인 필요</div>
    <div class="value">{{ stats.match_review }}<small>건</small></div>
  </a>
  <a class="stat {{ 'is-alert' if stats.send_failed }}" href="/notifications">
    <div class="label">문자 발송 실패</div>
    <div class="value">{{ stats.send_failed }}<small>건</small></div>
  </a>
  {% endif %}
</div>
