[project]
name = "academy"
version = "0.1.0"
description = "소규모 학원 관리 시스템 (FastAPI + HTMX)"
readme = "README.md"
authors = [
    { name = "jwp-system", email = "jwp.system@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "apscheduler>=3.11.3",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.48",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
academy = "academy.cli:main"   # 구축판 (학원 PC)
demo = "demo.cli:main"         # 데모판 (네이버클라우드)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# app: 공통, academy: 구축판, demo: 데모판
packages = ["src/app", "src/academy", "src/demo"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
extend-exclude = ["alembic/versions"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # 한글 docstring/메시지는 포매터에 맡긴다

[tool.pytest.ini_options]
testpaths = ["tests"]
